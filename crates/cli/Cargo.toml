[package]
name = "cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal front end for Open Photo AI: the `opai` binary."

[[bin]]
# The package is `cli` and the binary is `opai`, the command the README's examples name. No collision: `gui` builds
# `OpenPhotoAI` and `perf` builds `perftest`.
name = "opai"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
opai = { path = "../opai" }

# Argument parsing, as `perf` already does it. The derive API gives the optional-value flags (`--up [MODEL]`), the
# `requires` between `--scale` and `--upscale`, the aliases, `--help` and `--version` from one struct; `argh` and
# `bpaf` are smaller and are not what a Rust developer expects to find.
clap = { version = "4.6.7", features = ["derive"] }

# The install and inference progress bars. It hides its bars by itself when stderr is not a terminal, which is what a
# piped run needs, throttles its own redraws, and a `MultiProgress` holds one bar per dependency. `perf`'s `ratatui`
# would take over the whole terminal for two bars, which a command meant for pipelines should not do.
indicatif = "0.18.6"

# The project's error convention, matching `rust-sak`, `opai`, `gui` and `perf`.
thiserror = "2.0.20"

# `Opai::initialize` and `Opai::process` are `async`, so `main` needs a runtime; `signal` is what turns a Ctrl-C into
# the cancellation a run stops on. The same crate and features `perf` uses, minus the ones only its live view needs.
tokio = { version = "1.52.3", features = ["rt-multi-thread", "signal"] }

[dev-dependencies]
# A scratch directory for the input check's tests, as `opai` and `gui` use it.
tempfile = "3.27"
