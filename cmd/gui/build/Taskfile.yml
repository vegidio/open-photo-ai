version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go work sync`
    internal: true
    cmds:
      - go work sync

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/*
    preconditions:
      - sh: pnpm --version
        msg: "Looks like pnpm isn't installed. pnpm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - pnpm install

  build:frontend:
    label: build:frontend (PRODUCTION={{.PRODUCTION}})
    summary: Build the frontend project
    dir: frontend
    sources:
      - "**/*"
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - pnpm run {{.BUILD_COMMAND}}
    env:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'
    vars:
      BUILD_COMMAND: '{{if eq .PRODUCTION "true"}}build{{else}}build:dev{{end}}'

  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates bindings for the frontend
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` files from an image
    dir: build
    # Two sources, deliberately. macOS 26 masks every app icon to the system squircle itself, so artwork that already
    # carries its own rounded shape and padding gets treated as non-conforming: the OS shrinks it onto a grey squircle
    # backplate. appicon-macos.png is therefore full-bleed and fully opaque, and lets the OS supply the shape. Windows
    # and Linux draw icon artwork literally, with no mask, so they keep appicon.png and the rounded corners baked into
    # it - handing them the full-bleed version would render a hard-cornered square. Re-apply after
    # `wails3 update build-assets`.
    sources:
      - "appicon.png"
      - "appicon-macos.png"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      # `generate icons` always writes both an .icns and an .ico, falling back to its default path for whichever
      # output is not named, so each run has to send the file it is not producing to a throwaway directory.
      - mkdir -p .icons-discard
      - wails3 generate icons -input appicon-macos.png -macfilename darwin/icons.icns -windowsfilename .icons-discard/unused.ico
      - wails3 generate icons -input appicon.png -macfilename .icons-discard/unused.icns -windowsfilename windows/icon.ico
      - rm -rf .icons-discard

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - pnpm run dev --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
