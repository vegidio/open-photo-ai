# The runtime is loaded once per process, and a failed load must fail every later initialization in the process
# naming the first path (the `initialization` capability). `runtime::start` is the one place allowed to load it,
# because it is the one place that records the first failure and turns a retry into `InitError::RuntimeUnavailable`.
#
# Enforced here rather than only in prose: the sanctioned call site carries an `#[allow]` saying so.
disallowed-methods = [
    { path = "rust_sak::ai::load", reason = "only `runtime::start` may load the runtime; it owns the failed-load latch" },
    { path = "rust_sak::ai::load_with", reason = "only `runtime::start` may load the runtime; it owns the failed-load latch" },
    { path = "rust_sak::ai::ort::init_from", reason = "the runtime is loaded through `runtime::start`, never by `ort` directly" },
]
