version: '3'

tasks:
  clean:
    desc: Clean the build directory
    cmds:
      - rm -rf {{.ROOT_DIR}}/build/*

  test:
    desc: Run the tests of every module in the workspace, plus the frontend suite
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    desc: Run the Go tests of every module in the workspace
    cmds:
      # -race is not optional here: the model registry hands out concurrent leases, and the bug class it exists to
      # prevent (freeing an ONNX session while another goroutine runs inference on it) is a native use-after-free that
      # kills the process instead of panicking. Without the race detector its tests prove very little.
      - go test -race ./...

      # cmd/gui embeds frontend/dist, which is a build artifact and so is absent on a fresh clone and in CI. Without
      # it the package does not compile and `go test ./...` fails before running a single test. A placeholder is
      # enough to satisfy the embed - no test reads the embedded assets, and a real build goes through `task gui`,
      # where vite writes the actual bundle over this.
      - mkdir -p cmd/gui/frontend/dist
      - test -e cmd/gui/frontend/dist/index.html || touch cmd/gui/frontend/dist/.embed-placeholder
      - for dir in cmd/cli cmd/gui cmd/perf; do (cd "$dir" && go test -race ./...) || exit 1; done

  test:frontend:
    desc: Run the frontend tests
    dir: cmd/gui/frontend
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm test

  # Perftest build tasks
  perf:
    desc: Build the performance test binary
    dir: cmd/perf
    requires:
      vars: [ arch ]
    vars:
      FILE: "{{if eq OS `windows`}}perftest.exe{{else}}perftest{{end}}"
    env:
      CGO_ENABLED: 1
      GOARCH: "{{.arch}}"
    cmds:
      - |
        go build -o "{{.ROOT_DIR}}/build/{{.FILE}}"
        {{if .isPackage}}7z a -tzip -mx=9 "{{.ROOT_DIR}}/build/perftest_{{OS}}_{{.arch}}.zip" "{{.ROOT_DIR}}/build/{{.FILE}}"{{end}}

  run:
    desc: Run the app
    dir: cmd/gui
    cmds:
      - wails3 dev

  # GUI build tasks
  gui:
    desc: Build the GUI version of the app
    dir: cmd/gui
    requires:
      vars: [ arch ]
    vars:
      OLD_FILE: "{{if eq OS `darwin`}}opai.app{{else}}{{if eq OS `windows`}}opai.exe{{else}}opai{{end}}{{end}}"
      NEW_FILE: "{{if eq OS `darwin`}}OpenPhotoAI.app{{else}}{{if eq OS `windows`}}OpenPhotoAI.exe{{else}}OpenPhotoAI{{end}}{{end}}"
    env:
      CGO_ENABLED: 1
      PRODUCTION: true
    cmds:
      - |
        # Pass the target arch as `GOARCH=`, not `ARCH=`: wails3 only consumes `GOOS=`/`GOARCH=` and
        # then appends its own `ARCH=<host arch>` as a task variable, which would win over ours.
        {{if eq OS "darwin"}}
          wails3 package GOARCH={{.arch}}
        {{else}}
          wails3 build GOARCH={{.arch}}
        {{end}}

        rm -rf "{{.ROOT_DIR}}/build/{{.NEW_FILE}}"
        mkdir -p "{{.ROOT_DIR}}/build"
        mv "{{.ROOT_DIR}}/cmd/gui/bin/{{.OLD_FILE}}" "{{.ROOT_DIR}}/build/{{.NEW_FILE}}"

        {{if .isPackage}}
          7z a -tzip -mx=9 "{{.ROOT_DIR}}/build/opai-gui_{{OS}}_{{.arch}}.zip" "{{.ROOT_DIR}}/build/{{.NEW_FILE}}"
        {{end}}

  package:
    desc: Build and pack in .zip files
    requires:
      vars: [ archs ]
    cmds:
      - |
        for arch in {{.archs}}; do
          task gui arch=$arch isPackage=true
        done