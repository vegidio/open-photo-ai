[package]
name = "cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal front end for Open Photo AI: the `opai` binary."

[[bin]]
# The package is `cli` and the binary is `opai`, the command the README's examples name. No collision: `gui` builds
# `OpenPhotoAI` and `perf` builds `perftest`.
name = "opai"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
opai = { path = "../opai" }

# Argument parsing, as `perf` already does it. The derive API gives the optional-value flags (`--up [MODEL]`), the
# `requires` between `--scale` and `--upscale`, the aliases, `--help` and `--version` from one struct; `argh` and
# `bpaf` are smaller and are not what a Rust developer expects to find.
clap = { version = "4.6.7", features = ["derive"] }

# The dependency line's styled text, and the colour of the plain lines through its `crossterm` re-export, so no direct
# `crossterm` dependency is needed. Declared as `perf` declares it, minus `scrolling-regions`, which only `perf`'s
# full-screen view uses; `rust-sak`'s `tui` already links this same `ratatui`.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

# Named directly, not reached through `opai`, because drawing to a terminal is front-end work and `opai` knows nothing
# about a user interface: `tui` is the gradient progress bar and its live one-line session; `fs` is `list_path`, which walks a
# directory input (already compiled for `opai`, which enables it at the same tag); `github` is the check for a newer
# release, as the GUI makes it (already compiled for `gui`). Pinned to the same tag as `opai`'s, `gui`'s and `perf`'s:
# all four tags move together, so the lock file holds a single `rust-sak`.
rust-sak = { git = "https://github.com/vegidio/rust-sak", tag = "26.10.6", features = ["fs", "github", "tui"] }

# The project's error convention, matching `rust-sak`, `opai`, `gui` and `perf`.
thiserror = "2.0.20"

# The notes, face report and provider details the terminal no longer shows, recorded instead as `opai` records its
# own: `opai::logging::init` has installed the `opai.log` sink, so a record from here lands in the same file.
tracing = "0.1.44"

# `Opai::initialize` and `Opai::process` are `async`, so `main` needs a runtime; `signal` is what turns a Ctrl-C into
# the cancellation a run stops on in plain mode. `macros` and `sync` are the `select!` and the `Notify` that abandon
# initialization on a Ctrl-C the dependency line reports. `time` is the deadline the check for a newer release is
# awaited under.
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

# `cmd` and PowerShell hand `*.jpg` to the program as written, where a Unix shell expands it; `wild` expands it on
# Windows and passes the arguments through unchanged everywhere else. A pattern matching nothing is kept as written,
# so it is refused as a missing input like any other path.
wild = "2.2.1"

[dev-dependencies]
# A scratch directory for the input check's tests, as `opai` and `gui` use it.
tempfile = "3.27"

# The recorder the telemetry tests read their spans and records back with (`src/test_support.rs`), as `gui`'s does.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
