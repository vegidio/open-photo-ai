name: build

# Runs only on a tag: the tests gate the builds, and the builds gate the release, so nothing is published unless the
# whole suite passed on the tagged commit.
on:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.vars.outputs.VERSION }}
    steps:
      - name: Set version
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION#v}" >> "$GITHUB_OUTPUT"

  test-rust:
    runs-on: ubuntu-latest
    # `actions: write` lets the cancel step below stop the whole run.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      # pnpm's version comes from `packageManager` in the GUI's package.json, so CI and local builds use the same one.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/gui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: crates/gui/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Also builds the frontend, which the gui crate's tests need to compile.
      - name: Run Rust tests
        run: just test rust

      # The test jobs run in parallel outside a matrix, so fail-fast doesn't reach them; cancel the run explicitly.
      - name: Cancel workflow on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  test-node:
    runs-on: ubuntu-latest
    # `actions: write` lets the cancel step below stop the whole run.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/gui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: crates/gui/pnpm-lock.yaml

      - name: Set up Just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run frontend tests
        run: just test node

      # The test jobs run in parallel outside a matrix, so fail-fast doesn't reach them; cancel the run explicitly.
      - name: Cancel workflow on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  build:
    needs: [version, test-rust, test-node]
    strategy:
      # One broken platform cancels the others; a partial set of binaries can't be released anyway.
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: macos-latest
            arch: arm64
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      OPAI_OTEL_ENDPOINT: ${{ secrets.OPAI_OTEL_ENDPOINT }}
      OPAI_OTEL_AUTH: ${{ secrets.OPAI_OTEL_AUTH }}
      VITE_FARO_URL: ${{ secrets.VITE_FARO_URL }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/gui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: crates/gui/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Set up Just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # What Tauri needs to compile on Linux. The .deb and .rpm bundlers are pure Rust, so no dpkg-deb or rpmbuild.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # The crates and tauri.conf.json (which omits `version`) all inherit `[workspace.package]`'s version, so only
      # Cargo.toml is stamped. Node rather than sed so one step works on every runner.
      - name: Set app version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.VERSION }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const stamp = (file, pattern) => {
              const before = fs.readFileSync(file, "utf8");
              const after = before.replace(pattern, (_, head, tail) => head + v + tail);
              if (after === before && !before.match(pattern)) throw new Error(`no version found in ${file}`);
              fs.writeFileSync(file, after);
            };
            stamp("Cargo.toml", /(\[workspace\.package\][^\[]*?^version = ")[^"]*(")/m);
          '
          grep -n '^version = ' Cargo.toml

      - name: Build and package
        run: just package ${{ matrix.arch }}

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ runner.os }}-${{ matrix.arch }}
          path: |
            build/opai-gui_*.zip
            build/opai-gui_*.deb
            build/opai-gui_*.rpm
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write
    steps:
      # The `fetch-depth: 0` is important to fetch all the tags
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/gui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # dlx rather than `pnpm add -g`: pnpm installs each global package in its own isolated directory, so release-it
      # can't find the changelog plugin. dlx puts both in one temporary install, where the plugin resolves.
      - name: Create the changelog
        run: pnpm dlx --package release-it --package @release-it/conventional-changelog@10.0.1 release-it --ci

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.version.outputs.VERSION }}
          tag: ${{ github.ref_name }}
          bodyFile: CHANGELOG.md
          replacesArtifacts: true
          artifacts: binaries/*.zip,binaries/*.deb,binaries/*.rpm
